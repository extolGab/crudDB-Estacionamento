
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
</head>

<body>

<h1 th:text="${produto == null ? 'Novo Produto' : 'Editar Produto'}">
    Cadastro de Produto
</h1>

<form method="post"
      th:action="${produto == null}
          ? @{/produtos/salvar}
          : @{/produtos/atualizar/{id}(id=${produto.get('id')})}">

    <label>Nome:</label>

    <input type="text"
           name="nome"
           th:value="${produto != null ? produto.get('nome') : ''}"
           required>

    <br><br>

    <label>Descrição:</label>

    <textarea name="descricao"
              th:text="${produto != null ? produto.get('descricao') : ''}">
        </textarea>

    <br><br>

    <label>Categoria:</label>

    <select name="categoria" required>

        <option value="ELETRONICOS"
                th:selected="${produto != null and produto.get('categoria') == 'ELETRONICOS'}">
            Eletrônicos
        </option>

        <option value="ALIMENTOS"
                th:selected="${produto != null and produto.get('categoria') == 'ALIMENTOS'}">
            Alimentos
        </option>

        <option value="ROUPAS"
                th:selected="${produto != null and produto.get('categoria') == 'ROUPAS'}">
            Roupas
        </option>

        <option value="OUTROS"
                th:selected="${produto != null and produto.get('categoria') == 'OUTROS'}">
            Outros
        </option>

    </select>

    <br><br>

    <label>Código:</label>

    <input type="text"
           name="codigo"
           th:value="${produto != null ? produto.get('codigo') : ''}"
           required>

    <br><br>

    <label>Quantidade:</label>

    <input type="number"
           name="quantidade"
           min="0"
           th:value="${produto != null ? produto.get('quantidade') : 0}"
           required>

    <br><br>

    <label>Estoque mínimo:</label>

    <input type="number"
           name="estoqueMinimo"
           min="0"
           th:value="${produto != null ? produto.get('estoque_minimo') : 5}"
           required>

    <br><br>

    <label>Preço:</label>

    <input type="number"
           name="preco"
           step="0.01"
           min="0"
           th:value="${produto != null ? produto.get('preco') : 0}"
           required>

    <br><br>

    <button type="submit">
        Salvar Produto
    </button>

    <a th:href="@{/produtos}">
        Cancelar
    </a>

</form>

</body>
</html>
